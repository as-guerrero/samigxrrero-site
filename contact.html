<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>connect · samigxrrero</title>
<meta name="description" content="Connect with Samí Guerrero.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&display=swap">
<link rel="stylesheet" href="styles.css?v=20261101q">
</head>
<body>


<div class="wrap">

  <header class="site-header bar">
    <a class="bar-l" href="about.html">about</a>
    <a class="logo" href="index.html">Samí Guerrero</a>
    <a class="bar-r" href="contact.html" aria-current="page">connect</a>
  </header>

  <main class="contact2" aria-label="Contact">
    <section class="c-direct">
      <h1 class="sr-only">connect</h1>
      <a class="c-email" href="mailto:hello@samigxrrero.com">hello@samigxrrero.com</a>
    </section>

    <section class="c-follow" aria-label="Instagram">
      <a class="c-follow-card" href="https://www.instagram.com/samigxrrero" target="_blank" rel="noopener">
        <img class="c-still" src="img/connect-trees.webp" alt="Trees against the sky, black and white" width="1040" height="1040" loading="lazy">
        <span class="c-handle">@samigxrrero</span>
      </a>
    </section>

    <section class="c-inquiry" aria-label="Inquiry">
      <p class="label inq-title">Project Inquiry Form</p>
      <form class="inquiry">
        <div class="inq-row">
          <label><span>First Name</span><input name="first" type="text" autocomplete="given-name" required></label>
          <label><span>Last Name</span><input name="last" type="text" autocomplete="family-name" required></label>
        </div>
        <label><span>Business Name</span><input name="business" type="text" autocomplete="organization"></label>
        <label><span>Instagram Handle</span><span class="at-wrap"><span class="at" aria-hidden="true">@</span><input name="ig" type="text" autocapitalize="none" autocorrect="off" spellcheck="false"></span></label>
        <label><span>Email Address</span><input name="email" type="email" autocomplete="email" required></label>
        <label><span>Subject</span><input name="subject" type="text" required></label>
        <label><span>What is your ideal project start date?</span><input name="start" type="text"></label>
        <label><span>Tell me about your project, the more detail the better.</span><textarea name="details" rows="6" required></textarea></label>
        <label><span>What is your project budget?</span><input name="budget" type="text"></label>
        <input type="text" name="_honey" class="sr-only" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="inq-send"><button class="btn" type="submit">Send Inquiry</button></div>
        <p class="inq-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>


</div>
<script>
(function () {
  // the form posts to the site's own /api/inquiry, which emails it to sami (see worker/index.js)
  var f = document.querySelector('.inquiry'), status = f.querySelector('.inq-status'), btn = f.querySelector('button');
  var v = function (n) { return f[n].value.trim(); };
  // the @ is already shown in front of the instagram box, so drop any @ people type themselves
  f.ig.addEventListener('input', function () { var s = f.ig.value.replace(/@/g, ''); if (s !== f.ig.value) f.ig.value = s; });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var data = {};
    ['first', 'last', 'business', 'ig', 'email', 'subject', 'start', 'details', 'budget', '_honey'].forEach(function (k) { data[k] = v(k); });
    btn.disabled = true; btn.textContent = 'Sending…'; status.textContent = '';
    fetch('/api/inquiry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || r.status); }); })
      .then(function () {
        f.reset(); btn.textContent = 'Sent'; status.textContent = 'Thank you, I’ll be in touch.';
        setTimeout(function () { btn.disabled = false; btn.textContent = 'Send Inquiry'; }, 4000);
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Send Inquiry';
        status.textContent = 'Something went wrong. Please try again, or email hello@samigxrrero.com.';
      });
  });
})();
</script>
<script src="site.js?v=20261101d"></script>
</body>
</html>
