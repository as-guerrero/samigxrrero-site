  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>

<div class="wrap">

<script src="site.js?v=20261026v"></script>
<script src="photos.js?v=20261026a"></script>
<script>
/* photo page. without ?c= it lists the categories (name on the left, how many photos on the right).
   with ?c=landscape it shows that category's photos, best first (the order they sit in photos.js).
   loads 24 at a time as you scroll; clicking a photo opens it on vsco. */
(function () {
  var all = window.PHOTOS || [], ORDER = window.PHOTO_CATS || [];
  var stream = document.getElementById('stream'), cats = document.getElementById('cats');
  var want = new URLSearchParams(location.search).get('c');
  var groups = {};
  all.forEach(function (p) { var c = p.cat || 'archive'; (groups[c] = groups[c] || []).push(p); });
  var names = ORDER.filter(function (c) { return groups[c]; });
  if (groups.archive && names.indexOf('archive') < 0) names.push('archive');

  if (!want || !groups[want]) {
    cats.innerHTML = names.map(function (c) {
      return '<a class="vid-meta cat-row" href="photo.html?c=' + encodeURIComponent(c) + '"><span>' + c +
        '</span><span class="dim">' + groups[c].length + '</span></a>';
    }).join('');
    return;
  }

  cats.hidden = true;
  var back = document.getElementById('back'), title = document.getElementById('cat-title');
  back.href = 'photo.html'; back.textContent = '← all photos';
  title.textContent = want; title.hidden = false;
  document.title = want + ' · photo · samigxrrero';

  var list = groups[want], next = 0, BATCH = 24;
  var reveal = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); reveal.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -8% 0px' }) : null;
  function add() {
    list.slice(next, next + BATCH).forEach(function (p) {
      var base = p.src + '?w=';
      var a = document.createElement('a');
      a.className = 'still'; a.href = p.link; a.target = '_blank'; a.rel = 'noopener';
      a.setAttribute('aria-label', 'open this photo on vsco');
      a.innerHTML = '<img src="' + base + '900" srcset="' + base + '600 600w, ' + base + '900 900w, ' + base + '1400 1400w" sizes="(max-width: 760px) 100vw, 720px" width="' + p.w + '" height="' + p.h + '" alt="" loading="lazy" decoding="async">';
      stream.appendChild(a);
      if (reveal) reveal.observe(a); else a.classList.add('in');
    });
    next += BATCH;
    if (next >= list.length && more) more.disconnect();
  }
  var more = 'IntersectionObserver' in window ? new IntersectionObserver(function (e) { if (e[0].isIntersecting) add(); }, { rootMargin: '1200px 0px' }) : null;
  add();
  if (more) more.observe(document.querySelector('.stream-more')); else while (next < list.length) add();
})();
</script>
</body>
</html>
