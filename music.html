<script>
(function () {
  var tracks = [{"title": "Deus Sive Natura", "apple": "https://music.apple.com/us/album/deus-sive-natura/6800412531?i=6800412533", "spotify": "https://open.spotify.com/track/4HXy3je6lJchGeOc383nKH", "preview": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/29/ec/99/29ec99df-e4ab-f80d-c8bd-853fc5c81eff/mzaf_16142720809235309807.plus.aac.p.m4a"}, {"title": "Somewhere", "apple": "https://music.apple.com/us/album/somewhere/6800410194?i=6800410405", "spotify": "https://open.spotify.com/track/5jDhTgVIWVGUUbDGsKz39r", "preview": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/ec/bf/fb/ecbffbd1-58f7-43b6-96ce-bec64899cad9/mzaf_14854160168208244527.plus.aac.p.m4a"}, {"title": "Recharge", "apple": "https://music.apple.com/us/album/recharge/6800412531?i=6800412534", "spotify": "https://open.spotify.com/track/2VSFihJBx4udHDUf4Q3N8V", "preview": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/8b/ab/bc/8babbc30-f08a-ad97-80e0-30f1ca487391/mzaf_18434777570009737408.plus.aac.p.m4a"}, {"title": "Summit", "apple": "https://music.apple.com/us/album/summit/6800412531?i=6800412536", "spotify": "https://open.spotify.com/track/7Kz8a1QNeRRAQSJmfA39AC", "preview": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/bd/84/d5/bd84d544-c817-29cb-8c82-0934837dccca/mzaf_4215276583341821697.plus.aac.p.m4a"}, {"title": "Canopy", "apple": "https://music.apple.com/us/album/canopy/6800412531?i=6800412535", "spotify": "https://open.spotify.com/track/7KtbKJlX4h0kPc40bRYPqx", "preview": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/ce/0c/c9/ce0cc93d-b30b-1a54-d583-49c869fd4d1a/mzaf_6922418572690519204.plus.aac.p.m4a"}, {"title": "A World Stood Still", "apple": "https://music.apple.com/us/album/a-world-stood-still/6800396852?i=6800396853", "spotify": "https://open.spotify.com/track/5hZmByi2AAzLaJDHWuD4TL", "preview": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/77/54/11/775411e5-568c-01db-a3fe-be2cf1f9312d/mzaf_10397217579398778686.plus.aac.p.m4a"}, {"title": "El Apagón Eterno", "apple": "https://music.apple.com/us/album/el-apag%C3%B3n-eterno/6800396759?i=6800396760", "spotify": "https://open.spotify.com/track/0lw0rKah85RdEclNsf6nbx", "preview": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/6f/95/e2/6f95e222-79c2-50fa-616c-ddd6257e6d2c/mzaf_13564776211063747993.plus.aac.p.m4a"}];
  var i = 0, audio = new Audio();
  audio.preload = 'none';
  audio.crossOrigin = 'anonymous';
  var tape = document.querySelector('.scope'), title = document.getElementById('title');
  var pos = document.getElementById('pos'), dlg = document.getElementById('where');
  document.getElementById('total').textContent = tracks.length;

  // pull new releases from Apple Music automatically; newest new songs go first
  var SPOTIFY_ARTIST = 'https://open.spotify.com/artist/5Z75hnB9WIqxigd2EnNWuS';
  fetch('https://itunes.apple.com/lookup?id=6800396577&entity=song&limit=200&country=us')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var known = {}, live = {};
      tracks.forEach(function (t) { known[t.title.toLowerCase()] = t; });
      var songs = (data.results || []).filter(function (r) { return r.wrapperType === 'track'; });
      songs.forEach(function (r) { live[r.trackName.toLowerCase()] = true; });
      var fresh = songs
        .filter(function (r) { return r.wrapperType === 'track' && r.previewUrl; })
        .sort(function (a, b) { return new Date(b.releaseDate) - new Date(a.releaseDate); })
        .filter(function (r) {
          var t = known[r.trackName.toLowerCase()];
          if (t) { t.preview = r.previewUrl; t.apple = r.trackViewUrl || t.apple; return false; }
          return true;
        })
        .map(function (r) {
          return { title: r.trackName, apple: r.trackViewUrl, spotify: SPOTIFY_ARTIST, preview: r.previewUrl };
        });
      // songs taken off Apple Music drop off here too (only when Apple answered with a real list)
      var kept = songs.length ? tracks.filter(function (t) { return live[t.title.toLowerCase()]; }) : tracks;
      if (!fresh.length && kept.length === tracks.length) return;
      var current = tracks[i];
      tracks = fresh.concat(kept);
      if (!tracks.length) return;
      if (audio.paused && !audio.src) i = 0; else i = Math.max(0, tracks.indexOf(current));
      document.getElementById('total').textContent = tracks.length;
      show();
    })
    .catch(function () {});

  function show() {
    var t = tracks[i];
    title.textContent = t.title;
    pos.textContent = i + 1;
    tape.setAttribute('aria-label', (audio.paused ? 'Play ' : 'Pause ') + t.title);
  }
  function setPlaying(on) {
    tape.classList.toggle('playing', on);
    tape.setAttribute('aria-pressed', on);
    show();
  }
  function load(n, autoplay) {
    i = (n + tracks.length) % tracks.length;
    audio.src = tracks[i].preview;
    show();
    if (autoplay) audio.play();
  }

  tape.addEventListener('click', function () {
    wave.wake();
    if (!audio.src) load(i, false);
    if (audio.paused) audio.play(); else audio.pause();
  });
  audio.addEventListener('play', function () { setPlaying(true); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('ended', function () { load(i + 1, true); });
  // if a song won't load with permission to read its sound, play it plainly (the wave then just breathes)
  audio.addEventListener('error', function () {
    if (!audio.crossOrigin || !audio.src) return;
    audio.removeAttribute('crossorigin');
    wave.plain();
    var t = audio.src; audio.src = t; audio.play().catch(function () {});
  });
  var wave = scope(document.getElementById('wave'), audio, tape);

  document.querySelectorAll('.skip').forEach(function (b) {
    b.addEventListener('click', function () { load(i + +b.dataset.step, !audio.paused); });
  });

  document.querySelector('.track').addEventListener('click', function () {
    document.getElementById('go-apple').href = tracks[i].apple;
    document.getElementById('go-spotify').href = tracks[i].spotify;
    dlg.showModal();
  });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  dlg.querySelectorAll('.where-links a').forEach(function (a) {
    a.addEventListener('click', function () { dlg.close(); });
  });
  show();

  // the line: a calm sine wave at rest, bent into the song's own waveform while it plays
  function scope(cv, el, box) {
    var ctx = cv.getContext('2d'), ac = null, an = null, buf = null, ok = true, wired = false;
    var N = 160, ys = new Float32Array(N), live = 0, t = 0, w = 0, h = 0;
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function size() {
      var r = window.devicePixelRatio || 1;
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = Math.round(w * r); cv.height = Math.round(h * r);
      ctx.setTransform(r, 0, 0, r, 0, 0);
    }
    // the audio context starts on the tap (phones require that); the song is wired in once it actually plays
    function wake() {
      if (!ok) return;
      try {
        if (!ac) {
          var AC = window.AudioContext || window.webkitAudioContext;
          ac = new AC();
          an = ac.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = .6;
          an.connect(ac.destination);
          buf = new Float32Array(an.fftSize);
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ok = false; }
    }
    function wire() {
      if (wired || !ok || !ac || !el.crossOrigin) return;
      try { ac.createMediaElementSource(el).connect(an); wired = true; } catch (e) { ok = false; }
    }
    el.addEventListener('playing', wire);
    function frame() {
      var playing = !el.paused;
      live += ((playing ? 1 : 0) - live) * .06;
      t += still ? 0 : .012 + live * .02;
      var reading = playing && wired;
      if (reading) an.getFloatTimeDomainData(buf);
      var mid = h / 2, amp = h * .36;
      for (var k = 0; k < N; k++) {
        var x = k / (N - 1);
        var rest = Math.sin(x * Math.PI * 4 - t * 2) * .22;
        var song = 0;
        if (reading) {
          // average each point's slice of samples so the line stays smooth
          var step = Math.floor(buf.length / N), a = k * step, sum = 0;
          for (var j = 0; j < step; j++) sum += buf[a + j];
          song = sum / step * 2.4;
        } else if (playing) {
          song = Math.sin(x * Math.PI * 9 + t * 5) * .18 * Math.sin(t * 1.3);
        }
        var target = rest * (1 - live * .6) + song * live;
        ys[k] += (Math.max(-1, Math.min(1, target)) - ys[k]) * .35;
      }
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(232, 232, 230, .08)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, Math.round(mid) + .5); ctx.lineTo(w, Math.round(mid) + .5); ctx.stroke();
      ctx.strokeStyle = 'rgba(232, 232, 230, ' + (.7 + live * .3) + ')'; ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (k = 0; k < N; k++) {
        var edge = Math.sin(Math.PI * k / (N - 1)); // ends rest on the center line
        var px = k / (N - 1) * w, py = mid - ys[k] * amp * Math.pow(edge, .6);
        if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.stroke();
      requestAnimationFrame(frame);
    }
    size();
    window.addEventListener('resize', size);
    requestAnimationFrame(frame);
    return { wake: wake, plain: function () { if (!wired) ok = false; } };
  }
})();
</script>
