<script>
(function () {
  var cards = document.querySelectorAll('.vid[data-id]');
  if (!cards.length) return;
  var ready = new Promise(function (r) { window.onYouTubeIframeAPIReady = r; });
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  var canHover = window.matchMedia('(hover: hover)').matches;
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  cards.forEach(function (card) {
    var id = card.dataset.id, frame = card.querySelector('.frame');
    var preview = null, timer = null, full = false, want = false;

    function start() {
      want = true;
      if (full || preview || calm) return;
      ready.then(function () {
        if (full || !want || preview) return;
        var host = document.createElement('div');
        host.className = 'loop';
        frame.appendChild(host);
        preview = new YT.Player(host, {
          videoId: id,
          playerVars: { autoplay: 1, mute: 1, controls: 0, disablekb: 1, playsinline: 1, rel: 0, iv_load_policy: 3, fs: 0 },
          events: {
            onReady: function (e) {
              var p = e.target, s = +card.dataset.start || 0, end = +card.dataset.end || s + 6;
              p.mute(); p.seekTo(s, true); p.playVideo();
              timer = setInterval(function () {
                var t = p.getCurrentTime();
                if (t >= end || t < s - 1) p.seekTo(s, true);
              }, 150);
            },
            onStateChange: function (e) { if (e.data === 1) card.classList.add('looping'); }
          }
        });
      });
    }
    function stop() {
      want = false;
      if (full) return;
      clearInterval(timer);
      card.classList.remove('looping');
      if (preview) { preview.destroy(); preview = null; }
      var l = frame.querySelector('.loop'); if (l) l.remove();
    }
    function play() {
      full = true;
      clearInterval(timer);
      if (preview) { preview.destroy(); preview = null; }
      frame.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
        '?autoplay=1&rel=0&playsinline=1" title="' + card.querySelector('.vid-meta span').textContent +
        '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      card.classList.add('playing');
    }

    if (canHover) {
      card.addEventListener('mouseenter', start);
      card.addEventListener('mouseleave', stop);
    }
    card.querySelector('.play').addEventListener('click', play);
  });
})();
</script>
