<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>shop draft C · samigxrrero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&display=swap">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="stylesheet" href="../styles.css?v=20261103b">
<link rel="stylesheet" href="shop-drafts.css?v=1">
<style>body::after{background-image:url(../img/grain.png)}</style>
</head>
<body>
<div class="wrap">
  <header class="site-header bar">
    <a class="bar-l" href="shop-c.html" aria-current="page">shop</a>
    <a class="logo" href="../index.html">Samí Guerrero</a>
    <a class="bar-r" href="../contact.html">connect</a>
  </header>
  <main class="shop" aria-label="Shop">
    <div class="kinds" role="group" aria-label="Jump to">
      <button type="button" data-k="zine" aria-pressed="true">zines</button><button type="button" data-k="poster" aria-pressed="false">posters</button><button type="button" data-k="cd" aria-pressed="false">cds</button>
    </div>
    <section class="one" aria-roledescription="carousel" aria-label="Shop">
      <button class="arrow prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg></button>
      <div class="piece" aria-live="polite"></div>
      <button class="arrow next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button>
    </section>
    <p class="piece-count"></p>
  </main>
</div>
<script>
var ITEMS=[{"k": "zine", "n": "in awe, of all.", "p": "$15", "img": "../img/zines/in-awe-of-all.webp", "o": "mailto:hello@samigxrrero.com?subject=Order%3A%20in%20awe%2C%20of%20all."}, {"k": "zine", "n": "two.", "p": "$15", "img": "../img/zines/two.webp", "o": "mailto:hello@samigxrrero.com?subject=Order%3A%20two."}, {"k": "zine", "n": "sudo ./survive.sh", "p": "$15", "img": "../img/zines/sudo-survive.webp", "o": "mailto:hello@samigxrrero.com?subject=Order%3A%20sudo%20./survive.sh"}, {"k": "poster", "n": "poster one", "p": "$25", "img": null, "o": "mailto:hello@samigxrrero.com?subject=Order%3A%20poster%20one"}, {"k": "poster", "n": "poster two", "p": "$25", "img": null, "o": "mailto:hello@samigxrrero.com?subject=Order%3A%20poster%20two"}, {"k": "poster", "n": "poster three", "p": "$25", "img": null, "o": "mailto:hello@samigxrrero.com?subject=Order%3A%20poster%20three"}, {"k": "cd", "n": "cd one", "p": "$12", "img": null, "o": "mailto:hello@samigxrrero.com?subject=Order%3A%20cd%20one"}, {"k": "cd", "n": "cd two", "p": "$12", "img": null, "o": "mailto:hello@samigxrrero.com?subject=Order%3A%20cd%20two"}], i=0;
var piece=document.querySelector('.piece'), count=document.querySelector('.piece-count');
function art(it){
  if(it.img) return '<div class="item-art art-'+it.k+'"><img src="'+it.img+'" alt="'+it.n+' cover"></div>';
  if(it.k==='cd') return '<div class="item-art art-cd stand"><i class="disc"></i></div>';
  return '<div class="item-art art-poster stand"><span>poster art</span></div>';
}
function show(n){
  i=(n+ITEMS.length)%ITEMS.length; var it=ITEMS[i];
  piece.innerHTML=art(it)+'<div class="item-line"><span>'+it.n+'</span><span class="price">'+it.p+'</span></div><a class="btn" href="'+it.o+'">order</a>';
  count.textContent=(i+1)+' / '+ITEMS.length;
  document.querySelectorAll('.kinds button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===it.k)});
}
document.querySelector('.prev').onclick=function(){show(i-1)};
document.querySelector('.next').onclick=function(){show(i+1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});
var x0=null;piece.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
piece.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)show(d<0?i+1:i-1);x0=null});
document.querySelectorAll('.kinds button').forEach(function(b){b.onclick=function(){show(ITEMS.findIndex(function(t){return t.k===b.dataset.k}))}});
show(0);
</script>
</body>
</html>
